name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check colab_agent_bridge tests

  type-check:
    name: Type Checking (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Typecheck Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[typecheck]"

      - name: Run Mypy
        run: mypy colab_agent_bridge

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest with coverage
        run: |
          pytest tests -v --cov=colab_agent_bridge --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  build-and-verify:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution with twine
        run: twine check --strict dist/*

      - name: Verify clean wheel installation and CLI entrypoint
        run: |
          python -m venv verify-env
          ./verify-env/bin/pip install --upgrade pip
          ./verify-env/bin/pip install dist/*.whl
          ./verify-env/bin/colab-bridge --help
          ./verify-env/bin/colab-bridge --version

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/
          retention-days: 7

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for leaked credentials or sensitive files
        run: |
          echo "Scanning tracked git files for forbidden sensitive files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.pem|\.key|id_rsa|id_ed25519|sessions\.json|token\.json|\.token\.json|credentials/|\.colab)' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Found forbidden credential/private key files tracked in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden sensitive credentials or files tracked in repository."
